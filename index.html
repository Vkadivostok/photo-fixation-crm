<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Фотоотчет по заказ-наряду: фиксация автомобиля до и после работ">
    <title>Фотофиксация — фото до и после</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header no-print">
            <button class="brand" type="button" onclick="app.showView('dashboard')" aria-label="На главный экран">
                <div class="brand-icon">F</div>
                <div>
                    <h1 class="brand-title">Фотофиксация</h1>
                    <div class="brand-subtitle">Фото до / после</div>
                </div>
            </button>
            <div class="storage-badge">Демо</div>
        </header>

        <main id="dashboard-view" class="view active">
            <section class="stats-grid" aria-label="Статистика фотоотчетов">
                <div class="stat-card">
                    <span class="stat-value" id="stats-total">0</span>
                    <span class="stat-label">Фотоотчетов</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value stat-warning" id="stats-active">0</span>
                    <span class="stat-label">Без фото после</span>
                </div>
            </section>

            <section class="order-entry">
                <label class="field-label" for="order-number">Номер заказ-наряда</label>
                <div class="scan-row">
                    <input type="text" id="order-number" class="input-field text-mono" autocomplete="off" inputmode="text" placeholder="WO-2026-0001">
                    <button class="icon-btn" type="button" onclick="app.startScanner('order-number')" aria-label="Сканировать штрихкод">
                        <span aria-hidden="true">▦</span>
                    </button>
                </div>
                <button class="btn btn-primary btn-full" type="button" onclick="app.startReportFromInput()">Открыть фотоотчет</button>
            </section>

            <section class="list-header">
                <h2>Фотоотчеты</h2>
                <span id="orders-count" class="count-pill">0</span>
            </section>

            <div class="search-container">
                <input type="search" id="search-input" class="search-input" placeholder="Поиск по номеру заказ-наряда" oninput="app.searchReports()">
            </div>

            <section class="reports-list" id="reports-list" aria-live="polite"></section>
        </main>

        <main id="report-view" class="view">
            <div class="report-toolbar no-print">
                <button class="btn btn-secondary" type="button" onclick="app.showView('dashboard')">Назад</button>
                <button class="btn btn-primary" type="button" onclick="window.print()">Печать</button>
            </div>

            <article class="photo-report-card" id="report-card-content">
                <header class="report-head">
                    <div>
                        <div class="eyebrow">Заказ-наряд</div>
                        <h2 id="report-order-number">#</h2>
                        <p id="report-date" class="text-muted"></p>
                    </div>
                    <span class="badge" id="report-status">В работе</span>
                </header>

                <section class="photo-section">
                    <div class="section-title-row">
                        <h3>До работ</h3>
                        <span class="count-pill" id="before-count">0</span>
                    </div>
                    <div class="photo-grid" id="before-grid"></div>
                    <button class="btn btn-secondary btn-full no-print" type="button" onclick="app.addPhoto('before')">Добавить фото до</button>
                </section>

                <section class="photo-section">
                    <div class="section-title-row">
                        <h3>После работ</h3>
                        <span class="count-pill" id="after-count">0</span>
                    </div>
                    <div class="photo-grid" id="after-grid"></div>
                    <button class="btn btn-secondary btn-full no-print" type="button" onclick="app.addPhoto('after')">Добавить фото после</button>
                </section>
            </article>
        </main>

        <main id="scanner-view" class="view scanner-view">
            <button class="scanner-close-btn" type="button" onclick="app.stopScanner()" aria-label="Закрыть сканер">×</button>
            <div class="scanner-shell">
                <div id="scanner-container-element"></div>
                <div class="scanner-frame" aria-hidden="true">
                    <div class="scanner-laser"></div>
                </div>
                <div class="scanner-panel">
                    <div class="scanner-title">Сканер заказ-наряда</div>
                    <button class="btn btn-secondary" type="button" onclick="app.simulateScan()">Демо-номер</button>
                    <p id="scanner-status" class="scanner-status"></p>
                </div>
            </div>
        </main>

        <div class="modal-overlay" id="camera-modal">
            <div class="camera-shell">
                <button class="scanner-close-btn" type="button" onclick="app.closeCameraModal()" aria-label="Закрыть камеру">×</button>
                <video id="camera-stream-video" autoplay playsinline></video>
                <div class="camera-frame" aria-hidden="true"></div>
                <div class="camera-actions">
                    <button class="circle-btn" type="button" onclick="app.closeCameraModal()" aria-label="Отмена">×</button>
                    <button class="capture-btn" type="button" onclick="app.captureCameraPhoto()" aria-label="Сделать фото"></button>
                    <button class="circle-btn" type="button" onclick="app.toggleCameraFacing()" aria-label="Переключить камеру">↻</button>
                </div>
                <input type="file" id="photo-file-input" accept="image/*" capture="environment" onchange="app.handleFilePhoto(event)" hidden>
            </div>
        </div>
    </div>

    <script src="app.js?v=2.0"></script>
</body>
</html>
